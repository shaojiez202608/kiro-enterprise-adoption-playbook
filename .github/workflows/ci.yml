# Checks only: nothing in this workflow deploys or writes to the repository.
# There is no AWS deployment in this project, so there is no synth/cdk-nag job and no deploy workflow.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint, unit and browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: examples/frontend-demo/package-lock.json
      - name: Lint
        run: node tools/lint.mjs
      - name: Install demo dependencies from the lock file
        run: npm ci --prefix examples/frontend-demo
      - name: Install Chromium for Playwright
        run: npx --prefix examples/frontend-demo playwright install --with-deps chromium
      - name: Unit tests (includes the hook integration test)
        run: npm run test:unit
      - name: Browser tests
        run: npm run test:e2e

  links:
    name: official links reachable
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Check links
        run: npm run check:links

  secrets:
    name: gitleaks full history and canary
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      # From gitleaks_8.30.1_checksums.txt of the official release. A public SHA-256 checksum, not a secret;
      # the pragma below exempts this one line from detect-secrets' high-entropy check.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb # pragma: allowlist secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (checksum verified)
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/bin"
          tar -xzf gitleaks.tar.gz -C "${RUNNER_TEMP}/bin" gitleaks
          rm gitleaks.tar.gz
      - name: Scan history and verify the canary is detected
        run: GITLEAKS="${RUNNER_TEMP}/bin/gitleaks" bash tools/scan-secrets.sh

  ash:
    # Not run locally (no Docker on the maintainer machine); this job is where ASH runs.
    # A scanner that did not complete counts as a failure, like an actionable finding.
    name: ASH (all scanners must complete)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      UV_VERSION: 0.10.10
      # automated-security-helper v3.7.1 (lightweight tag; commit from git ls-remote)
      ASH_REF: af1206aff596f1288ad066828058b3011de2a998 # pragma: allowlist secret (public git commit hash)
    steps:
      # Same layout as ASH's own GitHub Actions tutorial: run ASH from a checkout of its repository so
      # the image build context contains pyproject.toml (running it from an installed package does not).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: awslabs/automated-security-helper
          ref: ${{ env.ASH_REF }}
          path: ash-src
          persist-credentials: false
      - name: Install uv
        run: python3 -m pip install --user "uv==${UV_VERSION}"
      # ASH's default base image is python:3.12-slim-bookworm on public.ecr.aws. Anonymous pulls from
      # GitHub-hosted runners hit "429 Too Many Requests", and `ash --custom-build-arg` is not passed to
      # the scan-mode image build. So the image is built here from the Docker Hub copy of the same tag,
      # with the build arguments ASH itself uses, and ASH runs it with --no-build.
      - name: Build the ASH image
        run: |
          docker build --target ci --tag automated-security-helper:ci \
            --build-arg "BASE_IMAGE=docker.io/library/python:3.12-slim-bookworm" \
            --build-arg "UID=$(id -u)" --build-arg "GID=$(id -g)" \
            --build-arg INSTALL_ASH_REVISION=LOCAL --build-arg OFFLINE=NO \
            --build-arg OFFLINE_SEMGREP_RULESETS=p/ci \
            --file ash-src/Dockerfile ash-src
      - name: Run ASH in container mode
        env:
          ASH_IMAGE_NAME: automated-security-helper:ci
        run: |
          "${HOME}/.local/bin/uv" run --directory ash-src ash --mode container --no-build --build-target ci \
            --source-dir "${GITHUB_WORKSPACE}/repo" --output-dir "${RUNNER_TEMP}/ash" \
            || echo "ash exited with $?"
      - name: Keep the ASH report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ash-report
          path: ${{ runner.temp }}/ash
          if-no-files-found: warn
          retention-days: 14
      - name: Fail on findings or incomplete scanners
        run: |
          python3 - "${RUNNER_TEMP}/ash/ash_aggregated_results.json" <<'PY'
          import json, sys
          stats = json.load(open(sys.argv[1]))["metadata"]["summary_stats"]
          print(json.dumps(stats, indent=2))
          bad = {k: stats.get(k, 0) for k in ("actionable", "failed", "missing")}
          if any(bad.values()):
              sys.exit(f"ASH did not pass: {bad}")
          PY
